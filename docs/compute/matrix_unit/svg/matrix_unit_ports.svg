<text x="40" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5a6573" font-weight="normal" text-anchor="start">One command at a time: C = A · B with INT8 or packed INT4 weights; unscaled INT32 or block-scaled FP32. Widths at default parameters.</text>
