<polyline points="250,715 290,715" fill="none" stroke="#1b2430" stroke-width="3.2"/>
<text x="298" y="719" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">bus</text>
<text x="40" y="740" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">Single clock domain clk_i. rst_ni: asynchronous assertion, synchronous deassertion; reset cancels the command in progress (no done_o).</text>
<text x="40" y="757" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">cmd_ready_o = !busy_o. Illegal command (K = 0, misaligned base, missing build feature, scaled K not a multiple of BlockK, continuing with no or other kept sums): done_o + err_o, no traffic.</text>
<text x="40" y="774" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">cmd_clear_acc_i = 0 continues the sums the previous command kept; cmd_write_output_i = 0 keeps them in the unit (no C write, cmd_c_addr_i ignored).</text>
<text x="40" y="791" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">Request payload is held stable while matrix_req_valid_o &amp;&amp; !matrix_req_ready_i. Reads ask for whole 512 B rows or exactly the bytes left; writes carry exactly the C bytes.</text>
</svg>