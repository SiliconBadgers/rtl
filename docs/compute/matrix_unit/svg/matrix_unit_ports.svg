<polyline points="250,675 290,675" fill="none" stroke="#1b2430" stroke-width="3.2"/>
<text x="298" y="679" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">bus</text>
<text x="40" y="707" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">One clock, clk_i. rst_ni asserts asynchronously and deasserts synchronously; the controller resets the unit with the queues, the counter and the arbiter.</text>
<text x="40" y="724" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">cmd_ready_o, idle_o and every matrix_req_* output depend only on registers. A request stays unchanged until accepted.</text>
<text x="40" y="741" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">Each legal command publishes three milestones (inputs released; next contribution ready and complete together). An illegal one raises fault_o instead.</text>
<text x="40" y="758" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">Reads return in request order; a write accepted on edge n is committed by edge n + 1. The full contract: docs/compute/bpu_matrix_unit_spec.md.</text>
</svg>