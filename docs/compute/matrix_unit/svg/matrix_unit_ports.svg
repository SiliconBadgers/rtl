<text x="40" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#1b2430" font-weight="bold" text-anchor="start" xml:space="preserve">Matrix unit: top-level ports (bpu_matrix_unit)</text>
<text x="40" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">One command at a time: C = A · B with INT8 activations and INT8 or packed INT4 weights, unscaled or block-scaled, in five output encodings. Widths at defaults.</text>
