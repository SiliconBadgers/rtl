<text x="347" y="307" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">stream id of each read in flight,</text>
<text x="347" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">depth 4 × BufRows; replies in order</text>
<text x="347" y="360" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start">NoOverflow_A  NoUnderflow_A</text>
<rect x="625" y="265" width="260" height="105" rx="8" fill="#ffffff" stroke="#8a96a6" stroke-width="1.4"/>
<text x="637" y="287" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start">C staging + c_write</text>
<text x="637" y="307" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">512 B row of finished C rows;</text>
<text x="637" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">write when full or at the last row</text>
<text x="637" y="360" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start">NoReadWriteOverlap_A</text>
<rect x="45" y="410" width="260" height="115" rx="8" fill="#fff4e8" stroke="#1b2430" stroke-width="1.4"/>
<text x="57" y="432" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start">u_array (bpu_sa_array)</text>
<text x="57" y="452" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">Rows × Cols PEs, C stationary, carry-</text>
<text x="57" y="469" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">save; scaled: each PE scales every</text>
<text x="57" y="486" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">block into a 48-bit Q23.24 sum</text>
<text x="57" y="515" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start">CaptureShiftExclusive_A</text>
<rect x="335" y="410" width="260" height="115" rx="8" fill="#fff4e8" stroke="#1b2430" stroke-width="1.4"/>
<text x="347" y="432" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start">fx_to_f32 (inline, 2 stages)</text>
<text x="347" y="452" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">block-scaled rows: Q23.24 + flags</text>
<text x="347" y="469" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">→ binary32: leading 1 (registered),</text>
<text x="347" y="486" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">then normalize + round; per column</text>
<rect x="625" y="410" width="260" height="115" rx="8" fill="#fff4e8" stroke="#1b2430" stroke-width="1.4"/>
<text x="637" y="432" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start">u_out (bpu_sa_fifo)</text>
<text x="637" y="452" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">finished rows, OutDepth deep;</text>
<text x="637" y="469" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">space reserved before a row leaves</text>
<text x="637" y="486" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">the array (out_credit_q)</text>
<text x="637" y="515" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start">NoOverflow_A  NoUnderflow_A</text>
