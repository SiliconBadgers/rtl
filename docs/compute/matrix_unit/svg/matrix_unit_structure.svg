<polyline points="305,490 331,490" fill="none" stroke="#1b2430" stroke-width="1.5" marker-end="url(#aink)"/>
<text x="311" y="484" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">rows</text>
<polyline points="595,505 621,505" fill="none" stroke="#1b2430" stroke-width="1.5" marker-end="url(#aink)"/>
<polyline points="105,525 105,547 755,547 755,529" fill="none" stroke="#1b2430" stroke-width="1.5" marker-end="url(#aink)" stroke-dasharray="6 4"/>
<text x="365" y="541" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">unscaled: INT32 rows skip the conversion</text>
<polyline points="825,410 825,374" fill="none" stroke="#1b2430" stroke-width="1.5" marker-end="url(#aink)"/>
<polyline points="825,265 825,229" fill="none" stroke="#1b2430" stroke-width="1.5" marker-end="url(#aink)"/>
<text x="831" y="257" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">writes</text>
<text x="40" y="606" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">Also in every FIFO: NoOverflow_A / NoUnderflow_A (the read streams' row buffers included). Credits make overflow impossible; the assertions prove it in simulation.</text>
<text x="40" y="624" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">Invariants a checker can rely on: replies arrive in request order; no C write while reads are in flight; done_o only after the last write is accepted (writes get no reply).</text>
</svg>