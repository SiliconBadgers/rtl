<text x="652" y="602" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start" xml:space="preserve">pack + u_out (bpu_sa_fifo)</text>
<text x="652" y="622" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">zero outside M × N, element j at</text>
<text x="652" y="639" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">byte eb·j; OutDepth rows, space</text>
<text x="652" y="656" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">reserved before a row leaves</text>
<text x="652" y="690" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start" xml:space="preserve">NoOverflow_A  NoUnderflow_A</text>
<rect x="60" y="725" width="840" height="80" rx="8" fill="#ffffff" stroke="#8a96a6" stroke-width="1.4"/>
<text x="72" y="747" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start" xml:space="preserve">milestones + idle</text>
<text x="72" y="767" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">inputs released when the last array step is fed; next contribution ready and complete together at the finish,</text>
<text x="72" y="784" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">at most two per cycle, the excess held for the next (ms_held_q); idle_o: no command running, nothing held or on milestone_inc_o</text>
