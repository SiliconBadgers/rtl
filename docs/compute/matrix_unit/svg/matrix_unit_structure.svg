<text x="57" y="287" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b2430" font-weight="bold" text-anchor="start">feed</text>
<text x="57" y="307" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">A, B head rows → one array step per</text>
<text x="57" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">cycle; INT4 pairs k, k+1; scaled: the</text>
<text x="57" y="341" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">block's sA, sB lanes and flags</text>
<rect x="335" y="265" width="260" height="105" rx="8" fill="#ffffff" stroke="#8a96a6" stroke-width="1.4"/>
