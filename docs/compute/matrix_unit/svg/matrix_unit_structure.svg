<text x="637" y="162" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">arbitrate(): fewest reserved rows</text>
<text x="637" y="179" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5a6573" font-weight="normal" text-anchor="start">first; one request held until ready</text>
<text x="637" y="215" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#b42318" font-weight="normal" text-anchor="start">ExpectedResponse_A</text>
