<text x="40" y="878" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">Every FIFO also carries NoOverflow_A / NoUnderflow_A, the read streams' row buffers included; credits make overflow impossible and the assertions check it.</text>
<text x="40" y="895" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">Invariants a checker can rely on: replies in request order; no C write while reads are in flight; complete is counted no earlier than the last write's commit edge.</text>
</svg>