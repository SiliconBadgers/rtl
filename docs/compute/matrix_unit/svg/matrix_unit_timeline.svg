<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="698" viewBox="0 0 1180 698" role="img">
<title>One block-scaled command</title><desc>Schematic waveform of a block-scaled command on an 8 x 8 array, K = 128 (two blocks).</desc>
