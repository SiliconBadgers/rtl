<text x="291.75" y="207" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#b4531b" font-weight="normal" text-anchor="middle">sA</text>
<rect x="301.5" y="193" width="19.5" height="20" rx="3" fill="#ffffff" stroke="#b4531b" stroke-width="1.3"/>
<text x="311.25" y="207" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#b4531b" font-weight="normal" text-anchor="middle">sB</text>
<rect x="925.5" y="193" width="32.5" height="20" rx="3" fill="#ffffff" stroke="#b4531b" stroke-width="1.3"/>
<text x="941.75" y="207" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#b4531b" font-weight="normal" text-anchor="middle">W</text>
<text x="40" y="252" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">matrix_rsp_valid_i</text>
<text x="40" y="267" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5a6573" font-weight="normal" text-anchor="start">read data only, in order</text>
<polyline points="230,260 1140,260" fill="none" stroke="#eef1f5" stroke-width="1"/>
<polyline points="230,260 275.5,260 275.5,240 282.0,240 282.0,260 295.0,260 295.0,240 301.5,240 301.5,260 314.5,260 314.5,240 321.0,240 321.0,260 334.0,260 334.0,240 340.5,240 340.5,260 1140,260" fill="none" stroke="#0f6e8c" stroke-width="1.8"/>
<text x="40" y="298" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">array in (feed)</text>
<text x="40" y="313" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5a6573" font-weight="normal" text-anchor="start">block flags; scales on last</text>
