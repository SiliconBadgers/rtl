<polyline points="230,444 1140,444" fill="none" stroke="#eef1f5" stroke-width="1"/>
<polyline points="230,444 1104.611111111111,444 1104.611111111111,424 1110.677777777778,424 1110.677777777778,444 1140,444" fill="none" stroke="#b4531b" stroke-width="1.8"/>
<polyline points="240.11111111111111,484 381.66666666666663,484" fill="none" stroke="#5a6573" stroke-width="1.2"/>
