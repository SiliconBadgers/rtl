<polyline points="230,352 695.1111111111111,352 695.1111111111111,332 735.5555555555555,332 735.5555555555555,352 1018.6666666666666,352 1018.6666666666666,332 1059.111111111111,332 1059.111111111111,352 1140,352" fill="none" stroke="#1b2430" stroke-width="1.8"/>
