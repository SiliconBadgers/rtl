<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="716" viewBox="0 0 1180 716" role="img">
<title>One block-scaled command</title><desc>Schematic waveform of a block-scaled command on an 8 x 8 array, K = 64 (four blocks).</desc>
<defs><marker id="ain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f6e8c"/></marker><marker id="aout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4531b"/></marker><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2430"/></marker></defs>
<rect width="1180" height="716" fill="#ffffff"/>
<text x="40" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#1b2430" font-weight="bold" text-anchor="start">One block-scaled command: what a checker should see</text>
<text x="40" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5a6573" font-weight="normal" text-anchor="start">8 × 8 array, K = 64 (four 16-wide blocks), INT8, arbiter always ready, read latency 4, delayed write completion. Schematic: cycle numbers approximate, not to scale.</text>
<text x="40" y="114" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">cmd_valid_i / cmd_ready_o</text>
<text x="40" y="129" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5a6573" font-weight="normal" text-anchor="start">handshake</text>
