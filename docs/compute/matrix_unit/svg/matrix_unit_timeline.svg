<polyline points="230,122 230.0,122 230.0,102 236.5,102 236.5,122 1140,122" fill="none" stroke="#0f6e8c" stroke-width="1.8"/>
<text x="40" y="160" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">busy_o</text>
<polyline points="230,168 1140,168" fill="none" stroke="#eef1f5" stroke-width="1"/>
