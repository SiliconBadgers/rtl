<text x="737.0" y="282" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">last + slast</text>
<polyline points="425.0,284 425.0,308" fill="none" stroke="#5a6573" stroke-width="1" stroke-dasharray="3 3"/>
<polyline points="529.0,284 529.0,308" fill="none" stroke="#5a6573" stroke-width="1" stroke-dasharray="3 3"/>
<polyline points="633.0,284 633.0,308" fill="none" stroke="#5a6573" stroke-width="1" stroke-dasharray="3 3"/>
<text x="529.0" y="282" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">block edges (last | first)</text>
<text x="40" y="344" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">array out rows</text>
<text x="40" y="359" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5a6573" font-weight="normal" text-anchor="start">once, after the last block</text>
<polyline points="230,352 1140,352" fill="none" stroke="#eef1f5" stroke-width="1"/>
<polyline points="230,352 860.5,352 860.5,332 912.5,332 912.5,352 1140,352" fill="none" stroke="#1b2430" stroke-width="1.8"/>
<text x="40" y="390" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">matrix_wr_done_i</text>
<text x="40" y="405" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5a6573" font-weight="normal" text-anchor="start">WriteAcks = 0; Matrix tag</text>
<polyline points="230,398 1140,398" fill="none" stroke="#eef1f5" stroke-width="1"/>
<polyline points="230,398 1062.0,398 1062.0,378 1068.5,378 1068.5,398 1140,398" fill="none" stroke="#0f6e8c" stroke-width="1.8"/>
<text x="40" y="436" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b2430" font-weight="normal" text-anchor="start">done_o</text>
<polyline points="230,444 1140,444" fill="none" stroke="#eef1f5" stroke-width="1"/>
<polyline points="230,444 1075.0,444 1075.0,424 1081.5,424 1081.5,444 1140,444" fill="none" stroke="#b4531b" stroke-width="1.8"/>
<polyline points="243.0,484 340.5,484" fill="none" stroke="#5a6573" stroke-width="1.2"/>
<text x="243.0" y="498" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">read ahead (credits)</text>
<polyline points="321.0,506 737.0,506" fill="none" stroke="#5a6573" stroke-width="1.2"/>
<text x="321.0" y="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">blocks 0-3 accumulate; scaling overlaps the next block</text>
<polyline points="737.0,484 860.5,484" fill="none" stroke="#5a6573" stroke-width="1.2"/>
<text x="737.0" y="498" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">PE settle + scale</text>
<polyline points="860.5,506 958.0,506" fill="none" stroke="#5a6573" stroke-width="1.2"/>
<text x="860.5" y="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">convert, request C write</text>
<polyline points="958.0,484 1075.0,484" fill="none" stroke="#5a6573" stroke-width="1.2"/>
<text x="958.0" y="498" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6573" font-weight="normal" text-anchor="start">wait for write completion</text>
<text x="230.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">0</text>
<text x="360.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">20</text>
<text x="490.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">40</text>
<text x="620.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">60</text>
<text x="750.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">80</text>
<text x="880.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">100</text>
<text x="1010.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">120</text>
<text x="1140.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">140</text>
<text x="220" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="end">cycle</text>
<text x="40" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="bold" text-anchor="start">Rules a checker can enforce</text>
<text x="52" y="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Replies arrive in request order, one pulse each; read data byte n is the byte at the request address + n.</text>
<text x="52" y="616" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• No C write is requested while any read is in flight (NoReadWriteOverlap_A).</text>
<text x="52" y="634" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Rows leave the array Rows + Cols − 1 cycles after the last k-step, + 4 when block-scaled (the PE's scaling pipeline); block ends never stall.</text>
<text x="52" y="652" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• done_o pulses once, after every accepted write completes; busy_o stays high and cmd_ready_o low until then. err_o never without done_o.</text>
<text x="52" y="670" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• WriteAcks = 0: matrix_wr_done_i carries tagged write completion. WriteAcks = 1: completion uses matrix_rsp_valid_i; tie matrix_wr_done_i low.</text>
<text x="52" y="688" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Reads total exactly K·Rows + K·Cols (or K·Cols/2 for INT4) + 2·(Rows + Cols)·K/BlockK bytes; writes exactly 4·Rows·Cols bytes.</text>
</svg>