<text x="376.7741935483871" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">20</text>
<text x="523.5483870967741" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">40</text>
<text x="670.3225806451612" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">60</text>
<text x="817.0967741935484" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">80</text>
<text x="963.8709677419355" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">100</text>
<text x="1110.6451612903224" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle" xml:space="preserve">120</text>
<text x="220" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="end" xml:space="preserve">cycle</text>
<text x="40" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="bold" text-anchor="start" xml:space="preserve">Rules a checker can enforce</text>
<text x="52" y="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• Replies arrive in request order, one pulse each; read data byte n is the byte at the request address + n.</text>
<text x="52" y="616" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• No C write is requested while any read is in flight (NoReadWriteOverlap_A).</text>
<text x="52" y="634" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• Rows leave the array Rows + Cols − 1 cycles after the last k-step, + 4 when block-scaled; block ends never stall.</text>
<text x="52" y="652" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• milestone_inc_o: 01 after the last k-step is fed, 10 at completion, never 11; complete is counted no earlier than the last write's commit edge.</text>
<text x="52" y="670" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• idle_o is low from the cycle after acceptance until the cycle after the last milestone is on milestone_inc_o.</text>
<text x="52" y="688" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start" xml:space="preserve">• Reads total exactly K·Rows + K·Cols (⌈K·Cols/2⌉ for INT4) + 2·(Rows + Cols)·⌈K/BlockK⌉ bytes; writes exactly eb·Rows·Cols bytes.</text>
</svg>