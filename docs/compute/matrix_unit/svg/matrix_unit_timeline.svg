<text x="230.0" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">0</text>
<text x="356.3888888888889" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">25</text>
<text x="482.77777777777777" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">50</text>
<text x="609.1666666666667" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">75</text>
<text x="735.5555555555555" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">100</text>
<text x="861.9444444444445" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">125</text>
<text x="988.3333333333334" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">150</text>
<text x="1114.7222222222222" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="middle">175</text>
<text x="220" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5a6573" font-weight="normal" text-anchor="end">cycle</text>
<text x="40" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="bold" text-anchor="start">Rules a checker can enforce</text>
<text x="52" y="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Replies arrive in request order, one pulse each; read data byte n is the byte at the request address + n.</text>
<text x="52" y="616" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• No C write is requested while any read is in flight (NoReadWriteOverlap_A).</text>
<text x="52" y="634" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Each block's rows leave the array Rows + Cols − 1 cycles after its last k-step; the scale stage adds 8 cycles.</text>
<text x="52" y="652" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• done_o pulses once, after the last write is accepted (writes get no reply); err_o never without done_o.</text>
<text x="52" y="670" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5a6573" font-weight="normal" text-anchor="start">• Reads total exactly K·Rows + K·Cols (or K·Cols/2 for INT4) + 2·(Rows + Cols)·K/64 bytes; writes exactly 4·Rows·Cols bytes.</text>
</svg>