[project]
name = "siliconbadgers-rtl-tools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.6"]

[tool.uv]
package = false
required-version = ">=0.12.23"
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
